version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '/sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/basemap.json'
    headers:
      - key: Cache-Control
        value: 'public, max-age=86400'
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'geolocation=(self), camera=(self)'
